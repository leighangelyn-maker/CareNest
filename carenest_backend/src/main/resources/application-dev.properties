# Server
server.port=8080
server.servlet.context-path=/

# Database - H2 (Development)
spring.datasource.url=jdbc:h2:mem:carenest_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - let Hibernate create the schema from @Entity classes (no Flyway needed in dev)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in dev - schema is managed by Hibernate ddl-auto above
spring.flyway.enabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT (Development)
jwt.secret=carenest-dev-secret-key-2026
jwt.expiration=900000

# Logging (Detailed for development)
logging.level.com.example.carenest=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Email (dev - set these env vars or leave blank, app won't crash without them)
sendgrid.api-key=${SENDGRID_API_KEY:dev-key-not-set}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@carenest.dev}
app.base-url=${APP_BASE_URL:http://localhost:8080}